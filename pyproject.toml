[project]
name = "cadence"
version = "0.2.0"
description = "Contrastive speech analytics: judge a delivery against the range of several strong renditions of the same text."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "praat-parselmouth==0.4.5",
  "opensmile==2.5.1",
  "soundfile>=0.12",
  "pyloudnorm==0.1.1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "silero-vad==5.1.2",
  "gradio>=5.0,<6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "plotly>=5.20",
  "requests>=2.31",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = [
    "matplotlib>=3.11.2",
]

[project.scripts]
cadence = "cadence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence"]
