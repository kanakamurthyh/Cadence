<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence — speech delivery coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 30 30%22%3E%3Cpath d=%22M3 16 C6 8, 9 8, 11 15 S16 24, 19 14 S25 6, 27 13%22 fill=%22none%22 stroke=%22%233B8FD0%22 stroke-width=%223.2%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">

<body>
<div class="shell">
  <nav class="side" aria-label="Main">

      <span>Cadence</span>

    <a class="nav" data-route="reports" href="#/reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>Reports</a>
    <a class="nav" data-route="passages" href="#/passages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/></svg>Passages</a>
    <div class="nav-group">RESEARCH</div>
    <a class="nav" data-route="demo" href="#/demo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>Live demo<span class="pill-tag">JUDGES</span></a>

    <main id="main" tabindex="-1"></main>

<div class="toast" id="toast" role="alert" hidden></div>
<script src="/static/app.js"></script>
